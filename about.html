<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fan club page for Steve Harrington">
    <title>About Steve - Fan Club</title>
</head>
<body>

    <h2>Join the Steve Harrington Fan Club</h2>

    <p>Fill out the form below to show your support for Hawkins' favorite babysitter!</p>

    <form action="#">
        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" name="fname" placeholder="Your Name"><br><br>

        <label for="fav-season">Favorite Season:</label><br>
        <select id="fav-season" name="fav-season">
            <option value="1">Season 1</option>
            <option value="2">Season 2</option>
            <option value="3">Season 3</option>
            <option value="4">Season 4</option>
        </select><br><br>

        <label>Would you trust Steve to babysit?</label><br>
        <input type="radio" id="yes" name="babysit" value="yes">
        <label for="yes">Yes</label><br>
        <input type="radio" id="no" name="babysit" value="no">
        <label for="no">No</label><br><br>

        <input type="submit" value="Submit">
    </form>

    <br>
    <hr>
    <a href="index.html">Back to Home Page</a>

</body>
</html>
